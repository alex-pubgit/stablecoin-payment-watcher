[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paywatch"
dynamic = ["version"]
description = "Read-only watcher for stablecoin payments on EVM chains: confirmations, fake-token checks, Telegram / Discord / webhook alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
keywords = ["usdt", "usdc", "stablecoin", "payments", "bsc", "ethereum", "polygon", "webhook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx2>=2.16,<3",
    "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff==0.17.5",
]

[project.scripts]
paywatch = "paywatch.cli:main"

[project.urls]
Repository = "https://github.com/alex-pubgit/stablecoin-payment-watcher"

[tool.hatch.version]
path = "src/paywatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paywatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-m", "not live"]
markers = ["live: reads public blockchain nodes; excluded by default, run with -m live"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
